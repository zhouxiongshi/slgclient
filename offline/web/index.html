<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Cocos Creator | SLG Demo</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link rel="icon" href="favicon.ico"/>
  <!-- SLG_STYLE_START -->
<style>
  html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#14161a; }
  body { display:flex; align-items:center; justify-content:center; text-align:center; }
  h1.header, p.footer { display:none !important; }
  #GameDiv {
    width: min(100vw, 177.7778vh) !important;
    height: auto !important;
    aspect-ratio: 16 / 9;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    flex: none;
  }
  #Cocos3dGameContainer, #GameCanvas { width:100% !important; height:100% !important; }
</style>
<!-- SLG_STYLE_END -->
</head>
  <body>
    <h1 class="header">SLG Demo</h1>

    <div id="GameDiv">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="720"></canvas>
      </div>
    </div>
    <p class="footer">
      Created with <a href="https://www.cocos.com/products" title="Cocos Creator">Cocos Creator</a>
    </p>
    <!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>

<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
